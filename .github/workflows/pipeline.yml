# Re-runs the whole data pipeline whenever new data arrives.
#
# Why these triggers:
#  - push of batch.csv  -> a new batch of listens arrived (batch_sim.py)
#  - push of raw data / pipeline code -> results must be rebuilt to stay consistent
#  - workflow_dispatch  -> manual re-run for the demo
# Outputs (clean data, indicators, model metrics, report) are committed back,
# so the repo always holds the latest processed version.
name: data-pipeline

on:
  push:
    branches: [main]
    paths:
      - "batch.csv"
      - "data/raw/**"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false   # batches must be processed in order

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline (ingest -> clean -> ML -> indicators -> report)
        run: python pipeline.py

      - name: Publish report to the run summary
        run: cat reports/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit processed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clean reports data/raw/listens_from_batches.csv
          git diff --cached --quiet || git commit -m "pipeline: update processed data and report [skip ci]"
          git pull --rebase
          git push
